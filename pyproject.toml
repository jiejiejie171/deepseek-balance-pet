[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-balance-pet"
version = "0.2.0"
description = "Standalone Windows desktop pet showing DeepSeek API balance (no DSH required)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.7,<7", "requests>=2.31", "pygame>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.6", "pillow>=10"]

[project.scripts]
deepseek-pet = "deepseek_pet.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepseek_pet = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
