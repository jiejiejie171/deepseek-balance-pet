name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Build portable zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/build.ps1 -Version $ver
      - name: Create checksum
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          Get-FileHash "dist/DeepSeekPet-$ver-win-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  DeepSeekPet-$ver-win-x64.zip" } |
            Out-File dist/SHA256SUMS.txt -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DeepSeekPet-*-win-x64.zip
            dist/SHA256SUMS.txt
          body: |
            **No DSH required · Standalone**

            DeepSeek Balance Pet for Windows x64. This is a standalone desktop pet; it does
            not require DSH, does not read `.dsh`, and does not call `dsh plugin`.
